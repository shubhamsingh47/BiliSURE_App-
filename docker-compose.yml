version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: bilisure-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: bilisure
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bilisure-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/bilisure
      JWT_SECRET: bilisure_jwt_production_secret_key_87263541
      JWT_REFRESH_SECRET: bilisure_refresh_production_secret_key_19283746
    depends_on:
      - mongodb

volumes:
  mongo_data:
